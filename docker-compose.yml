services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bookmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookmind
      POSTGRES_PASSWORD: bookmind_password
      POSTGRES_DB: bookmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookmind -d bookmind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bookmind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookmind-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://bookmind:bookmind_password@postgres:5432/bookmind_db
      - DATABASE_URL_SYNC=postgresql://bookmind:bookmind_password@postgres:5432/bookmind_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - storage_data:/app/storage

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookmind-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info -c 4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://bookmind:bookmind_password@postgres:5432/bookmind_db
      - DATABASE_URL_SYNC=postgresql://bookmind:bookmind_password@postgres:5432/bookmind_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./backend:/app
      - storage_data:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookmind-frontend
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  storage_data:
